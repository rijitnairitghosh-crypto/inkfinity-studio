<h1>🛒 Shopping Cart</h1>

<div class="cart-item">
  <h2>Products Added</h2>

<p id="product"></p>
<p id="price"></p>

  <hr>

  <h3 id="total"></h3>
</div>

<a href="checkout.html">
  <button>Proceed to Checkout</button>
</a>

<br><br>

<a href="shop.html">
  <button>Continue Shopping</button>
</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function displayCart() {
    let html = "";
    let total = 0;

    cart.forEach((item, index) => {
        html += `
        <div style="border:1px solid #ddd; padding:15px; margin-bottom:15px; border-radius:10px;">
            <h3>${item.product}</h3>

            <p>Price: ₹${item.price}</p>

            <button onclick="decreaseQuantity(${index})">➖</button>

            <span style="margin:0 10px;">1</span>

            <button onclick="increaseQuantity(${index})">➕</button>

            <br><br>

            <button onclick="removeItem(${index})">🗑️ Remove</button>
        </div>
        `;

        total += item.price;
    });

    document.getElementById("product").innerHTML = html;
    document.getElementById("price").innerHTML = "";
    document.getElementById("total").innerText = "Total: ₹" + total;
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    displayCart();
}

function increaseQuantity(index) {
    alert("Quantity feature will be added in the next step.");
}

function decreaseQuantity(index) {
    alert("Quantity feature will be added in the next step.");
}

displayCart();
</script>
