<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | INKFINITY STUDIO</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo">♾️ INKFINITY STUDIO</div>

<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
<a href="cart.html">🛒 Cart</a>
</nav>
</header>

<h1>🛒 Shopping Cart</h1>

<div class="cart-item">
<h2>Products Added</h2>

<div id="product"></div>

<hr>

<h2 id="total"></h2>
</div>

<br>

<a href="checkout.html">
<button>Proceed to Checkout</button>
</a>

<br><br>

<a href="shop.html">
<button>Continue Shopping</button>
</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Give every old product a quantity of 1
cart.forEach(item => {
    if (!item.quantity) {
        item.quantity = 1;
    }
});

function displayCart() {

    let html = "";
    let total = 0;

    cart.forEach((item, index) => {

        html += `
        <div style="border:1px solid #ddd;padding:15px;margin-bottom:15px;border-radius:10px;">

            <h3>${item.product}</h3>

            <p><strong>Price:</strong> ₹${item.price * item.quantity}</p>

            <button onclick="decreaseQuantity(${index})">➖</button>

            <span style="margin:0 10px;font-weight:bold;">${item.quantity}</span>

            <button onclick="increaseQuantity(${index})">➕</button>

            <br><br>

            <button onclick="removeItem(${index})">🗑️ Remove</button>

        </div>
        `;

        total += item.price * item.quantity;

    });

    document.getElementById("product").innerHTML = html;
    document.getElementById("total").innerHTML = "Total: ₹" + total;

    localStorage.setItem("cart", JSON.stringify(cart));
}

function increaseQuantity(index) {
    cart[index].quantity++;
    displayCart();
}

function decreaseQuantity(index) {

    if (cart[index].quantity > 1) {
        cart[index].quantity--;
    } else {
        cart.splice(index, 1);
    }

    displayCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    displayCart();
}

displayCart();
</script>

</body>
</html>
