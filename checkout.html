<h1>Checkout</h1>

<form>

<label>Customer Name</label><br>
<input type="text" placeholder="Enter your full name" required><br><br>

<label>Email ID</label><br>
<input type="email" placeholder="Enter your email" required><br><br>

<label>Mobile Number</label><br>
<input type="tel" placeholder="Enter your mobile number" required><br><br>

<label>Shipping Address Line 1</label><br>
<input type="text" placeholder="House No., Street" required><br><br>

<label>Shipping Address Line 2</label><br>
<input type="text" placeholder="Area, Landmark (Optional)"><br><br>

<label>Pin / Zipcode</label><br>
<input type="text" placeholder="Enter PIN Code" required><br><br>

<label>City Name</label><br>
<input type="text" placeholder="Enter City" required><br><br>

<label>State</label><br>
<input type="text" placeholder="Enter State" required><br><br>

<h3>Select Payment Method</h3>

<input type="radio" id="online" name="payment" value="Online Payment" required>
<label for="online">💳 Online Payment</label><br><br>

<input type="radio" id="cod" name="payment" value="Cash on Delivery">
<label for="cod">💵 Cash on Delivery</label><br><br>

<a href="thankyou.html">
    <button>Place Order</button>
</a>
</form>
